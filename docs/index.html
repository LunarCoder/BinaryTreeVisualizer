<!DOCTYPE html>
<html lang="en">   
<head>
  <title>BST Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <nav>
    <h1 id = "title">Binary Search Tree Visualizer and Pseudocode Highlighter</h1>
  </nav>

  <!-- Control buttons -->
  <section id = "controls">
    <input id = "valueInput" type="number" placeholder="Enter a whole value">
    <button id = "search">Search</button>
    <button id = "insert">Insert</button>
    <button id = "delete">Delete</button>
    <button id = "selByRank">Select by Rank</button>
    <button id = "clear">Clear</button>
    <button id = "random">Random Tree</button>
  </section>

  <!-- Main content section -->
  <div class = "main-content">
    <section id="bstView"> <!-- BST view, left-->
      <svg id="bst" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>

    <section id="highlighterView"> <!-- Highlighter view, right-->
      <h1 id="highlighterTitle">Code View</h1>
      <p id = "code">If foo is true, then do bar</p>

      <!-- Algorithm execution speed slider -->
      <div id="speedSlider">
        <label for="speed">Algorithm Speed:</label>
        <input id="speed" type="range" min="0" max="5000" value="3000" step="100">
      </div>
    </section>
  </div>

  <!-- Bottom info bar -->
  <nav id = "bottomnav">
    <h3>Philip Russell </h3>
    <h3>YSU Capstone Project 2026</h3>
  </nav>
</body>


<!-- Page Scripts -->
<script type="module" src="js/app.js"></script>
</html>
